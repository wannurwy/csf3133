<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Profile &amp; Marks Dashboard</h1>

        <section>
            <h2>Student Profile</h2>
            <p id="studentName"></p>
            <p id="matricNo"></p>
            <p id="programme"></p>
        </section>

        <section>
            <h2>Course Results</h2>
            <table>
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Course Name</th>
                        <th>Marks</th>
                    </tr>
                </thead>
                <tbody id="courseTable">
                    <!-- Course records will be generated using JavaScript -->
                </tbody>
            </table>
        </section>

        <section>
            <h2>Academic Summary</h2>
            <p>Average Marks: <strong id="averageMarks">-</strong></p>
            <p>Highest Marks: <strong id="highestMarks">-</strong></p>
        </section>

        <button id="removeCourseButton" onclick="removeLastCourse()">
            Remove Last Course
        </button>
    </div>

    <!-- Create script.js and link it here -->
    <script src="script.js"></script>
</body>
</html>
